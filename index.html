<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柔剣会計アプリ</title>
    <!-- Bootstrap CDNを安定版(5.3.3)に修正 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f7f9fc;
        }

        .app-container {
            max-width: 100%; 
            margin: 0 auto;
            padding-bottom: 80px; /* タスクバーのスペース確保 */
            background-color: white;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        h1 {
            padding: 20px;
            margin: 0;
            background-color: #3f51b5;
            color: white;
            text-align: center;
        }

        .screen-content {
            padding: 20px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        .product-item {
            border: 1px solid #ddd;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            background-color: #f9f9f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        .product-item:hover {
            background-color: #eef0fd;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }
        .cart-item button {
            margin: 0 2px;
            padding: 2px 8px;
            font-size: 0.9em;
        }
        
        .total-summary {
            margin-top: 15px;
            padding: 15px;
            background-color: #e8eaf6;
            border-radius: 6px;
        }
        .total-summary h3 {
            color: #d32f2f;
        }

        /* --- タスクバーのスタイル --- */
        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            padding: 6px 0;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.08);
            z-index: 1000;
        }
        
        .taskbar button {
            background-color: transparent;
            border: none;
            cursor: pointer;
            padding: 5px 15px;
            color: #757575;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: color 0.2s;
        }
        
        .taskbar button.active {
            color: #3f51b5;
            font-weight: bold;
        }
        
        .taskbar-icon {
            font-size: 20px;
        }

        .taskbar-label {
            font-size: 0.75rem;
        }
        
        .screen { display: none; }
        
        .log-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>柔剣会計</h1> 

        <!-- レジ会計画面（Bootstrapレスポンシブ対応） -->
        <div id="checkout-screen" class="screen screen-content">
            <h2 class="mb-3">会計レジ</h2>
            <div class="row g-4">
                <div class="col-12 col-md-6 border-end-md">
                    <h3>商品リスト</h3>
                    <ul id="product-list" class="product-list"></ul>
                </div>

                <div class="col-12 col-md-6">
                    <h3>カート内容</h3>
                    <ul id="cart-list" class="cart-list"></ul>
                    <hr>
                    <div class="total-summary">
                        <p class="mb-1">売れた商品の数 (合計): <strong id="total-items">0</strong> 個</p>
                        <h3><strong>合計金額:</strong> <span id="total-amount">0</span>円</h3>
                        <button id="checkout-button" class="btn btn-success w-100 mt-3 fs-5">
                            <i class="bi bi-cart-check"></i> 会計完了
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 商品登録画面 -->
        <div id="register-screen" class="screen screen-content">
            <h2 class="mb-3">商品登録</h2>
            <form id="register-form" class="mb-4">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-box"></i></span>
                    <input type="text" id="product-name" class="form-control" placeholder="商品名" required>
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text">¥</span>
                    <input type="number" id="product-price" class="form-control" placeholder="価格" required min="1">
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-plus-circle"></i> 商品を登録
                </button>
            </form>

            <h3>登録済み商品一覧</h3>
            <ul id="registered-products" class="list-group"></ul>
        </div>
        
        <!-- 会計履歴画面 -->
        <div id="log-screen" class="screen screen-content">
            <h2 class="mb-4">会計履歴ログ</h2>
            <div class="d-flex justify-content-end mb-3">
                <button id="clear-logs-button" class="btn btn-danger"><i class="bi bi-trash"></i> 全て削除</button>
            </div>
            <ul id="log-list" class="list-group"></ul>
        </div>

        <!-- タスクバー -->
        <div class="taskbar">
            <button id="nav-checkout" class="active" onclick="showScreen('checkout-screen', this)">
                <span class="taskbar-icon"><i class="bi bi-cash-coin"></i></span>
                <span class="taskbar-label">レジ会計</span>
            </button>
            <button id="nav-register" onclick="showScreen('register-screen', this)">
                <span class="taskbar-icon"><i class="bi bi-tags"></i></span>
                <span class="taskbar-label">商品登録</span>
            </button>
            <button id="nav-log" onclick="showScreen('log-screen', this)">
                <span class="taskbar-icon"><i class="bi bi-journal-text"></i></span>
                <span class="taskbar-label">購入履歴</span>
            </button>
        </div>
    </div>
    
    <script>
        const STORAGE_KEY = 'jyuukenApp_state';
        
        let state = {
            products: [],
            cart: [],
            logs: []
        };

        // XSS対策のエスケープ関数
        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // LocalStorageから状態をロード
        function loadState() {
            const savedState = localStorage.getItem(STORAGE_KEY);
            if (savedState) {
                try {
                    state = JSON.parse(savedState);
                } catch (e) {
                    console.error('LocalStorageデータの読み込み失敗:', e);
                }
            }
        }

        // LocalStorageに状態を保存
        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        // 合計計算ヘルパー関数
        function calculateTotal(cart) {
            const totalAmount = cart.reduce((total, item) => total + item.price * item.quantity, 0);
            const totalItems = cart.reduce((count, item) => count + item.quantity, 0);
            return { totalAmount, totalItems };
        }

        // 商品リストUI更新
        function renderProductList() {
            const listEl = document.getElementById('product-list');
            listEl.innerHTML = '';
            
            if (state.products.length === 0) {
                listEl.innerHTML = '<p class="text-muted">登録されている商品がありません。「商品登録」画面から追加してください。</p>';
                return;
            }

            state.products.forEach(p => {
                const li = document.createElement('li');
                li.className = 'product-item';
                li.innerHTML = `
                    <span class="product-name"><strong>${escapeHTML(p.name)}</strong></span>
                    <span class="product-price">${p.price.toLocaleString()}円</span>
                `;
                li.onclick = () => addToCart(p);
                listEl.appendChild(li);
            });
            renderRegisteredProducts();
        }

        // カートUI更新
        function renderCart() {
            const cartEl = document.getElementById('cart-list');
            const totalAmountEl = document.getElementById('total-amount');
            const totalItemsEl = document.getElementById('total-items');
            const checkoutButton = document.getElementById('checkout-button');
            
            cartEl.innerHTML = '';
            
            if (state.cart.length === 0) {
                cartEl.innerHTML = '<p class="text-muted">カートに商品がありません</p>';
                totalAmountEl.textContent = '0';
                totalItemsEl.textContent = '0';
                checkoutButton.disabled = true;
                return;
            }

            checkoutButton.disabled = false;
            state.cart.forEach(item => {
                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `
                    <span>${escapeHTML(item.name)} × ${item.quantity}</span>
                    <span>
                        <button class="btn btn-sm btn-outline-secondary" onclick="changeQuantity(${item.id}, -1)">
                            <i class="bi bi-dash"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="changeQuantity(${item.id}, 1)">
                            <i class="bi bi-plus"></i>
                        </button>
                        <span class="ms-2 font-monospace">${(item.price * item.quantity).toLocaleString()}円</span>
                    </span>
                `;
                cartEl.appendChild(li);
            });

            const { totalAmount, totalItems } = calculateTotal(state.cart);
            totalAmountEl.textContent = totalAmount.toLocaleString();
            totalItemsEl.textContent = totalItems.toLocaleString();
        }

        // ログ画面UI更新
        function renderLog() {
            const logListEl = document.getElementById('log-list');
            const clearButton = document.getElementById('clear-logs-button');
            logListEl.innerHTML = '';

            if (state.logs.length === 0) {
                logListEl.innerHTML = '<p class="text-muted">過去の会計履歴はありません。</p>';
                clearButton.disabled = true;
                return;
            }
            
            clearButton.disabled = false;

            state.logs.forEach(log => {
                const li = document.createElement('li');
                li.className = 'list-group-item mb-3 rounded border shadow-sm';
                li.style.backgroundColor = '#fdfdfd';

                const innerHTML = `
                    <div class="log-item-header">
                        <div>
                            <strong style="color: #3f51b5;">No.${log.id} - ${log.timestamp}</strong>
                            <br>
                            <strong>合計: ${log.totalAmount.toLocaleString()}円 (${log.totalItems}個)</strong>
                        </div>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteLog(${log.id})">
                            <i class="bi bi-x-lg"></i> 削除
                        </button>
                    </div>
                    <p class="mb-1" style="font-size: 0.9em; font-weight: bold;">内訳:</p>
                    <ul style="list-style: none; padding-left: 15px; font-size: 0.9em;">
                        ${log.items.map(item => `
                            <li class="d-flex justify-content-between">
                                <span>${escapeHTML(item.name)} × ${item.quantity}</span>
                                <span>${(item.price * item.quantity).toLocaleString()}円</span>
                            </li>
                        `).join('')}
                    </ul>
                `;
                li.innerHTML = innerHTML;
                logListEl.appendChild(li);
            });
        }
        
        // 登録済み商品リスト更新
        function renderRegisteredProducts() {
            const listEl = document.getElementById('registered-products');
            listEl.innerHTML = '';
            
            state.products.forEach(p => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                li.innerHTML = `
                    <span>${escapeHTML(p.name)} (${p.price.toLocaleString()}円)</span>
                    <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                `;
                listEl.appendChild(li);
            });
        }

        // カート追加
        function addToCart(product) {
            const existingItem = state.cart.find(item => item.id === product.id);

            if (existingItem) {
                state.cart = state.cart.map(item =>
                    item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
                );
            } else {
                state.cart.push({ ...product, quantity: 1 });
            }

            updateUI();
        }

        // 数量変更
        function changeQuantity(id, delta) {
            state.cart = state.cart.map(item =>
                item.id === id ? { ...item, quantity: item.quantity + delta } : item
            ).filter(item => item.quantity > 0);
            
            updateUI();
        }

        // 商品登録（一意なID生成）
        function addProduct(name, price) {
            const newProduct = {
                id: Date.now(),
                name: name,
                price: price
            };
            state.products.push(newProduct);
            updateUI();
        }
        
        // 商品削除
        function deleteProduct(id) {
            if(confirm('本当にこの商品を削除しますか？カートに入っている場合も削除されます。')) {
                state.products = state.products.filter(p => p.id !== id);
                state.cart = state.cart.filter(item => item.id !== id);
                updateUI();
            }
        }

        // 会計完了処理
        function completeSale() {
            if (state.cart.length === 0) {
                alert('カートに商品がありません。');
                return;
            }

            const { totalAmount, totalItems } = calculateTotal(state.cart);

            const newLog = {
                id: state.logs.length + 1,
                timestamp: new Date().toLocaleString('ja-JP'),
                items: state.cart.map(item => ({...item})),
                totalAmount: totalAmount,
                totalItems: totalItems,
            };

            state.logs.unshift(newLog);
            state.cart = [];
            
            alert(`合計金額 ${totalAmount.toLocaleString()}円で会計を完了し、履歴に記録しました。`);
            updateUI();
        }
        
        // ログ削除
        function deleteLog(id) {
             if (confirm(`ログ No.${id} を削除してもよろしいですか？`)) {
                state.logs = state.logs.filter(log => log.id !== id);
                updateUI();
                renderLog();
            }
        }
        
        // 全ログ削除
        function clearAllLogs() {
            if (state.logs.length === 0) return;
            
            if (confirm('全ての会計履歴を完全に削除してもよろしいですか？この操作は元に戻せません。')) {
                state.logs = [];
                updateUI();
                renderLog();
            }
        }

        // 全画面UI更新
        function updateUI() {
            renderProductList();
            renderCart();
            saveState();
        }

        // 画面切り替え
        function showScreen(screenId, clickedButton) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.style.display = 'none';
            });
            document.getElementById(screenId).style.display = 'block';

            document.querySelectorAll('.taskbar button').forEach(button => {
                button.classList.remove('active');
            });
            clickedButton.classList.add('active');
            
            if (screenId === 'log-screen') {
                renderLog();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            updateUI();
            
            showScreen('checkout-screen', document.getElementById('nav-checkout'));

            // フォーム送信イベント
            document.getElementById('register-form').onsubmit = (e) => {
                e.preventDefault();
                const name = document.getElementById('product-name').value.trim();
                const price = parseInt(document.getElementById('product-price').value, 10);
                
                if (name && price > 0) {
                    addProduct(name, price);
                    document.getElementById('product-name').value = '';
                    document.getElementById('product-price').value = '';
                } else {
                    alert('商品名と有効な価格を入力してください。');
                }
            };
            
            // 会計ボタンクリックイベント
            document.getElementById('checkout-button').onclick = completeSale;
            
            // 【修正追加】ログ全削除ボタンのクリックイベント
            document.getElementById('clear-logs-button').onclick = clearAllLogs;
        });
    </script>
</body>
</html>
